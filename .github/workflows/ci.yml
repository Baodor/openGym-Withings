name: Tests
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m compileall -q app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend JavaScript syntax
        run: node --check app/static/app.js
      - name: Verify all five navigation tabs
        run: node --test tests/ui-navigation.test.cjs
      - name: Full application import smoke test
        env:
          DATA_DIR: /tmp/opengym-withings-ci
        run: python -c 'import app.main; print("Full app import OK")'
